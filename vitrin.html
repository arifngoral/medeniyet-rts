<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitrin · Medeniyet</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* The model showcase: an asset-library page. One WebGL canvas lies over the whole window; every card's viewport is a
   hole it draws into (src/vitrin.js). */
:root { --gold: #e3ad4c; --gold-2: #ffe1a0; --line: #d9a64a5c; --mline: #d9a64ad9; --ink: #fff3d6; --dim: #e2cfa8; --bg: #1a0f07; --card: #24160c; --display: 'Cinzel', Georgia, serif; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: 'Inter', "Segoe UI", system-ui, sans-serif, "Segoe UI Emoji", "Noto Color Emoji"; }
body { background: radial-gradient(ellipse at 50% -10%, #3a2312 0%, #1a0f07 55%) fixed; }
#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 2; }
header.top { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 14px clamp(14px, 3vw, 40px); background: linear-gradient(#1a0f07f2, #1a0f07d9); border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
.brand { display: flex; flex-direction: column; line-height: 1.05; margin-right: auto; }
.brand b { font: 800 1.5rem var(--display); letter-spacing: .06em; background: linear-gradient(#fffbe8 15%, #ffd679 55%, #d8902a 95%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand span { font: 700 .68rem var(--display); letter-spacing: .28em; text-transform: uppercase; color: var(--dim); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button, .seg button { font: 700 .72rem var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); background: #120a04a6; border: 1px solid var(--line); padding: 8px 12px; cursor: pointer; transition: color .2s, border-color .2s, background .2s; }
.chips button:hover, .seg button:hover { color: var(--ink); border-color: var(--mline); }
.chips button.on, .seg button.on { background: linear-gradient(#f0c261, #cf8f2e); color: #2a1404; border-color: #ffeec0; }
.chips button small { opacity: .7; margin-left: 4px; font: inherit; }
.seg { display: flex; } .seg button + button { border-left: 0; }
.tool { display: flex; align-items: center; gap: 8px; } .tool > span { font: 700 .64rem var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
a.back { color: var(--gold-2); font: 700 .72rem var(--display); letter-spacing: .14em; text-transform: uppercase; text-decoration: none; border: 1px solid var(--mline); padding: 8px 14px; }
a.back:hover { color: #fff; }
main { position: relative; z-index: 1; padding: 18px clamp(14px, 3vw, 40px) 60px; }
.lead { margin: 4px 0 18px; color: var(--dim); font-size: 14px; max-width: 900px; line-height: 1.5; }
.lead b { color: var(--gold-2); font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 18px; }
.card { position: relative; display: flex; flex-direction: column; background: linear-gradient(#2b1a0e, #1b1008); border: 1px solid var(--mline); box-shadow: inset 0 0 0 4px #1a0f07, inset 0 0 0 5px var(--line), 0 14px 30px #0009; }
.view { position: relative; aspect-ratio: 4 / 3; margin: 6px 6px 0; background: radial-gradient(ellipse at 50% 78%, #6a4a26 0%, #3a2513 45%, #1c1109 100%); overflow: hidden; }
.view::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 40px #000a; pointer-events: none; }
.tags { position: absolute; left: 8px; top: 8px; z-index: 3; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.tag { font: 700 .58rem var(--display); letter-spacing: .1em; text-transform: uppercase; padding: 3px 7px; border: 1px solid; background: #120a04cc; }
.tag.yeni { color: #9be28a; border-color: #5fae3a; } .tag.gorunus { color: #ffe1a0; border-color: #d9a64a; } .tag.animasyon { color: #9fd0f0; border-color: #4a8fc0; }
.state { position: absolute; right: 8px; top: 8px; z-index: 3; font: 700 .6rem var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); background: #120a04cc; border: 1px solid var(--line); padding: 3px 7px; }
.body { padding: 12px 14px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.name { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
.name b { font: 700 1.02rem var(--display); letter-spacing: .05em; color: var(--ink); }
.name span { font-size: 12px; color: var(--dim); }
.note { margin: 0; font-size: 12.8px; line-height: 1.5; color: #f1e3c4; }
.desc { margin: 0; font-size: 12px; line-height: 1.45; color: var(--dim); }
.acts { display: flex; flex-wrap: wrap; gap: 0; margin-top: auto; padding-top: 6px; }
.acts button { flex: 1; font: 700 .6rem var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); background: #120a04a6; border: 1px solid var(--line); padding: 6px 4px; cursor: pointer; }
.acts button + button { border-left: 0; }
.acts button.on { background: #e3ad4c33; color: var(--gold-2); border-color: var(--mline); }
.empty { color: var(--dim); padding: 30px 0; }
@media (max-width: 640px) { .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; } .brand b { font-size: 1.2rem; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="gl"></canvas>
<header class="top">
  <div class="brand"><b>VİTRİN</b><span>Medeniyet · model kitaplığı</span></div>
  <div class="chips" id="tabs"></div>
  <div class="tool"><span>Çağ</span><div class="seg" id="ages"></div></div>
  <a class="back" href="./">Oyuna dön</a>
</header>
<main>
  <p class="lead" id="lead"></p>
  <div class="grid" id="grid"></div>
</main>
<script type="module" src="./src/vitrin.js"></script>
</body>
</html>
